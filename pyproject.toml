[project]
name = "tg-discovery"
version = "0.1.0"
description = "Finds new venues and LGBTQ+ events for TravelGay admins to review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "publicsuffixlist>=1.0.2.20261007",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "rapidfuzz>=3.14.6",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tg_discovery"]

[tool.uv]
link-mode = "copy"  # the uv cache and the project may sit on different drives

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = [".", "src"]
extend-exclude = ["*.md"]  # ruff 0.16 would also reformat Python code blocks inside Markdown

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "S", "ASYNC", "PERF", "D"]
ignore = [
    "A005",  # src/tg_discovery/logging.py shadows the stdlib name on purpose; imports are absolute
    "D1",    # docstring presence is a judgment call; Google style is enforced wherever one is written
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "D"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: needs the compose Postgres (skipped when it is unreachable)"]

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "pyright"
test = "pytest"
check = ["lint", "format-check", "typecheck", "test"]
